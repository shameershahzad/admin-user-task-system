name: Sentra Review Decisions

on:
  issue_comment:
    types: [created]

permissions:
  statuses: write
  pull-requests: read

jobs:
  process-decision:
    if: github.event.issue.pull_request != null
    runs-on: self-hosted
    steps:
      - name: Send decision to Sentra
        id: sentra
        shell: powershell
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          $body = @{
            pr_number    = [int]$env:PR_NUMBER
            comment_body = $env:COMMENT_BODY
          } | ConvertTo-Json
          $response = Invoke-RestMethod -Uri "http://localhost:8000/api/projects/${{ vars.SENTRA_PROJECT_ID }}/ci-decide-findings" -Method POST -Headers @{ "X-Sentra-Api-Key" = "${{ secrets.SENTRA_API_KEY }}" } -ContentType "application/json" -Body $body
          Write-Host "Accepted: $($response.accepted -join ', ')"
          Write-Host "Rejected: $($response.rejected -join ', ')"
          Write-Host "All resolved: $($response.all_resolved)"
          echo "all_resolved=$($response.all_resolved)" >> $env:GITHUB_OUTPUT

      - name: Report status to GitHub
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prNumber = "${{ github.event.issue.number }}"
          $repo = "${{ github.repository }}"
          $token = $env:GH_TOKEN

          $headers = @{}
          $headers["Authorization"] = "Bearer $token"
          $headers["Accept"] = "application/vnd.github+json"

          $pr = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/pulls/$prNumber" -Headers $headers
          $sha = $pr.head.sha

          $allResolved = "${{ steps.sentra.outputs.all_resolved }}"
          $state = "pending"
          if ($allResolved -eq "True") {
            $state = "success"
          }

          $body = @{}
          $body["state"] = $state
          $body["context"] = "process-decision"
          $body["description"] = "Sentra review decision processed"
          $jsonBody = $body | ConvertTo-Json

          Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/statuses/$sha" -Method POST -Headers $headers -ContentType "application/json" -Body $jsonBody
